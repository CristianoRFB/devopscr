<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho</title><link rel="stylesheet" href="/css/styles.css"></head><body><nav><div class="nav-container"><div class="logo">Instituição - Loja</div><ul class="nav-links"><li><a href="/loja">Continuar comprando</a></li></ul></div></nav><main class="container cart-page"><h1>Seu carrinho</h1><div class="cart-list"><div class="cart-row" th:each="entry : ${itens}"><div class="store-image cart-image"><img th:if="${entry.key.imagem != null}" th:src="@{/produto/{id}/imagem(id=${entry.key.idProduto})}" th:alt="${entry.key.nomeProduto}"><span class="image-placeholder" th:unless="${entry.key.imagem != null}">Sem imagem</span></div><div class="cart-info"><h2 th:text="${entry.key.nomeProduto}"></h2><span th:text="${#numbers.formatCurrency(entry.key.precoProduto)}"></span></div><form th:action="@{/loja/carrinho/atualizar/{id}(id=${entry.key.idProduto})}" method="post"><input class="quantity-input" name="quantidade" type="number" min="0" th:value="${entry.value}"><button class="btn btn-small btn-secondary">Atualizar</button></form><strong th:text="${#numbers.formatCurrency(subtotais[entry.key.idProduto])}"></strong><form th:action="@{/loja/carrinho/remover/{id}(id=${entry.key.idProduto})}" method="post"><button class="btn btn-small btn-danger">Remover</button></form></div></div><div class="cart-summary"><span>Total</span><strong th:text="${#numbers.formatCurrency(total)}"></strong></div><p class="empty-state" th:if="${#maps.isEmpty(itens)}">Seu carrinho está vazio.</p></main></body></html>
