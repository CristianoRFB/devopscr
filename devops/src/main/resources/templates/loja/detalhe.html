<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${produto.nomeProduto}"></title><link rel="stylesheet" href="/css/styles.css"></head><body><nav><div class="nav-container"><div class="logo">Instituição - Loja</div><ul class="nav-links"><li><a href="/loja">Produtos</a></li><li><a class="cart-link" href="/loja/carrinho">Carrinho</a></li></ul></div></nav><main class="container detail-card"><div class="store-image detail-image"><img th:if="${produto.imagem != null}" th:src="@{/produto/{id}/imagem(id=${produto.idProduto})}" th:alt="${produto.nomeProduto}"><span class="image-placeholder" th:unless="${produto.imagem != null}">Sem imagem</span></div><div><h1 th:text="${produto.nomeProduto}"></h1><p th:text="${produto.descricaoProduto}"></p><strong class="detail-price" th:text="${#numbers.formatCurrency(produto.precoProduto)}"></strong><form th:action="@{/loja/carrinho/adicionar/{id}(id=${produto.idProduto})}" method="post"><label>Quantidade <input class="quantity-input" name="quantidade" type="number" min="1" value="1"></label><button class="btn btn-primary">Adicionar ao carrinho</button></form></div></main></body></html>
