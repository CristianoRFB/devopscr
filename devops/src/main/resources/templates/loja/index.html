<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja da Instituição</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><nav><div class="nav-container"><div class="logo">Instituição - Loja</div><ul class="nav-links"><li><a href="/loja">Produtos</a></li><li><a class="cart-link" href="/loja/carrinho">Carrinho</a></li><li><form action="/logout" method="post"><button class="btn btn-small btn-secondary">Sair</button></form></li></ul></div></nav>
<div class="page-header"><h1>Encontre o que você precisa</h1><p>Produtos oficiais da nossa instituição e atlética</p></div><main class="container">
<form class="store-search" action="/loja"><input name="busca" th:value="${busca}" placeholder="Buscar produtos..."><button class="btn btn-primary">Buscar</button></form>
<div class="product-grid"><article class="product-card" th:each="p : ${produtos}"><a th:href="@{/loja/produto/{id}(id=${p.idProduto})}"><div class="store-image"><img th:if="${p.imagem != null}" th:src="@{/produto/{id}/imagem(id=${p.idProduto})}" th:alt="${p.nomeProduto}"><span class="image-placeholder" th:unless="${p.imagem != null}">Sem imagem</span></div><div class="product-card-body"><h2 th:text="${p.nomeProduto}"></h2><p th:text="${p.descricaoProduto}"></p><strong th:text="${#numbers.formatCurrency(p.precoProduto)}"></strong></div></a><form th:action="@{/loja/carrinho/adicionar/{id}(id=${p.idProduto})}" method="post"><button class="btn btn-primary btn-full">Adicionar ao carrinho</button></form></article></div><p class="empty-state" th:if="${#lists.isEmpty(produtos)}">Nenhum produto encontrado.</p></main></body></html>
