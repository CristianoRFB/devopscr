<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body style="margin:0; padding:24px; background:#050505; color:#f8eeee; font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;">
    <table role="presentation" style="width:100%; max-width:640px; margin:0 auto; border-collapse:collapse; background:#0f0a0a; border:3px solid #f3d8d8;">
        <tr>
            <td style="padding:32px;">
                <p style="margin:0 0 16px; color:#ff9b9b; font-family:Arial Black, Impact, sans-serif; text-transform:uppercase;">Recuperacao de senha</p>
                <h1 style="margin:0; font-family:Arial Black, Impact, sans-serif; text-transform:uppercase; font-size:32px; line-height:1;">Redefina seu acesso</h1>
                <p style="margin:16px 0 24px; color:#c7a9a9; line-height:1.6;">
                    Recebemos uma solicitacao para redefinir sua senha. Use o link abaixo para concluir o processo.
                </p>
                <p style="margin:0 0 24px;">
                    <a th:href="${resetLink}" style="display:inline-block; padding:14px 20px; border:3px solid #f3d8d8; background:#c1121f; color:#fff5f5; text-decoration:none; font-family:Arial Black, Impact, sans-serif; text-transform:uppercase;">
                        Criar nova senha
                    </a>
                </p>
                <p style="margin:0; color:#c7a9a9; line-height:1.6;">
                    Se o botao nao funcionar, copie e cole este endereco no navegador:
                </p>
                <p style="margin:12px 0 0; word-break:break-all;">
                    <a th:href="${resetLink}" th:text="${resetLink}" style="color:#ff9b9b; text-decoration:none;"></a>
                </p>
            </td>
        </tr>
    </table>
</body>

</html>
