<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FatecADS</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/pages/formulario-aluno.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
</head>

<body class="page-shell">
    <main class="page page-auth">
        <nav class="top-nav">
            <a class="nav-chip" href="/fatecads">Tela Inicial</a>
            <a class="nav-chip" href="/fatecads/dashboard">Dashboard</a>
            <a class="nav-chip nav-chip-active" href="/login">Login</a>
        </nav>

        <section class="section-header">
            <p class="eyebrow">ACESSO //</p>
            <h1>Entrar no Sistema</h1>
            <p class="section-copy">Use seu login e sua senha para acessar o ambiente administrativo.</p>
        </section>

        <section class="auth-panel brutal-form">
            <div class="auth-kicker">
                <span class="auth-kicker-label">Autenticacao</span>
                <span class="auth-kicker-copy">Acesso protegido com validacao de sessao, redefinicao por token e senha criptografada.</span>
            </div>
            <div class="alert success-alert" th:if="${message}" th:text="${message}"></div>
            <div class="alert error-alert" th:if="${error}" th:text="${error}"></div>

            <form class="auth-form" method="post" th:action="@{/login}">
                <div class="form-grid auth-grid">
                    <label class="field field-full" for="username">
                        <span>Login</span>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                    </label>

                    <label class="field field-full" for="password">
                        <span>Senha</span>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </label>
                </div>

                <div class="actions-row">
                    <button class="button-primary" type="submit">Entrar</button>
                    <a class="button-secondary" href="/fatecads">Voltar para a tela inicial</a>
                    <a class="button-secondary" href="/forgot-password">Esqueci minha senha</a>
                    <a class="button-secondary" href="/usuarios/criar">Criar usuario</a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
